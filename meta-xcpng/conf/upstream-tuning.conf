## AlmaLinux 10.1 tunings

# RPROVIDES necessary for virtual packages mentionned in the RPMs we
# build but not created in the bridged layer.  They must all have a
# PREFERRED_RPM_RPROVIDER_ setting for do_deploy_rtdeps to be able to
# create the link.

RPROVIDES:acpica-tools:append:pn-acpica-tools = " iasl"
PREFERRED_RPM_RPROVIDER_iasl = "acpica-tools"
RPROVIDES:gcc-c++:append:pn-gcc = " g++"
PREFERRED_RPM_RPROVIDER_g++ = "gcc-c++"
RPROVIDES:perl-ExtUtils-MakeMaker:append:pn-perl-ExtUtils-MakeMaker = " virtual/perl_ExtUtils__MakeMaker_"
PREFERRED_RPM_RPROVIDER_virtual/perl_ExtUtils__MakeMaker_ = "perl-ExtUtils-MakeMaker"
RPROVIDES:perl-FindBin:append:pn-perl = " virtual/perl_FindBin_"
PREFERRED_RPM_RPROVIDER_virtual/perl_FindBin_ = "perl-FindBin"
RPROVIDES:perl-IPC-Cmd:append:pn-perl-IPC-Cmd = " virtual/perl_IPC__Cmd_"
PREFERRED_RPM_RPROVIDER_virtual/perl_IPC__Cmd_ = "perl-IPC-Cmd"
RPROVIDES:perl-JSON:append:pn-perl-JSON = " virtual/perl_JSON_"
PREFERRED_RPM_RPROVIDER_virtual/perl_JSON_ = "perl-JSON"
RPROVIDES:perl-lib:append:pn-perl = " virtual/perl_lib_"
PREFERRED_RPM_RPROVIDER_virtual/perl_lib_ = "perl-lib"
RPROVIDES:python-unversioned-command:append:pn-python3.12 = " python"
PREFERRED_RPM_RPROVIDER_python = "python-unversioned-command"
RPROVIDES:systemd:append:pn-systemd = " /usr/bin/systemctl"
PREFERRED_RPM_RPROVIDER_/usr/bin/systemctl = "systemd"
RPROVIDES:libusb1-devel:append:pn-libusb1 = " libusbx-devel"
PREFERRED_RPM_RPROVIDER_libusbx-devel = "libusb1-devel"
RPROVIDES:zlib-ng-compat-devel:append:pn-zlib-ng = " zlib-devel"
PREFERRED_RPM_RPROVIDER_zlib-devel = "zlib-ng-compat-devel"


# alternatives configuration overriding the defaults

PREFERRED_RPM_RPROVIDER_virtual/glibc-langpack-en_or_glibc-all-langpacks = "glibc-langpack-en"
PREFERRED_RPM_RPROVIDER_virtual/glibc-langpack_eq_2.39-58.el10_1.7.alma.1 = "glibc-langpack-en"

PREFERRED_RPM_RPROVIDER_virtual/libtiffxx.so.6___64bit_ = "libtiff"
PREFERRED_RPROVIDER_virtual/libtiffxx.so.6___64bit_ = "libtiff"

PREFERRED_RPM_RPROVIDER_virtual/libgccjit.so.0___64bit_ = "libgccjit"
PREFERRED_RPROVIDER_virtual/libgccjit.so.0___64bit_ = "gcc"
PREFERRED_RPROVIDER_virtual/libsframe.so.1___64bit_ = "binutils"

# FIXME: shouldn't those covered by meta-almalinux/conf/default-providers.conf ?

PREFERRED_RPROVIDER_virtual/SDL2_x86-64__ge_2.0.18 = "sdl2-compat"
PREFERRED_RPROVIDER_virtual/libSDL2-2.0.so.0___64bit_ = "sdl2-compat"
PREFERRED_RPROVIDER_virtual/environment_modules_ = "environment-modules"

# 10.0 still provides a few obsolete SRPMS

PREFERRED_RPROVIDER_virtual/tex_doc.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_exscale.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_fix-cm.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_fixltx2e.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_flafter.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_fontenc.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_ifthen.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_inputenc.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_latexsym.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_makeidx.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_oldlfont.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_shortvrb.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_t1cmr.fd_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_textcomp.sty_ = "texlive"


