## AlmaLinux 10.0 tunings

# alternatives configuration overriding the defaults

PREFERRED_RPROVIDER_virtual/glibc-langpack-en_or_glibc-all-langpacks = "glibc-langpack-en"
PREFERRED_RPROVIDER_virtual/glibc-langpack_eq_2.39-46.el10_0.4.alma.1 = "glibc-langpack-en"


# still provides a few obsolete SRPMS
# FIXME: shouldn't those covered by meta-almalinux/conf/default-providers.conf ?

# 18.x packages merged into llvm for 19.x
PREFERRED_RPROVIDER_lld = "llvm"
PREFERRED_RPROVIDER_lldb = "llvm"
PREFERRED_RPROVIDER_clang = "llvm"
PREFERRED_RPROVIDER_libomp = "llvm"

PREFERRED_RPROVIDER_virtual/libtiffxx.so.6___64bit_ = "libtiff"

PREFERRED_RPROVIDER_virtual/tex_doc.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_exscale.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_fix-cm.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_fixltx2e.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_flafter.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_fontenc.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_ifthen.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_inputenc.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_latexsym.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_makeidx.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_oldlfont.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_shortvrb.sty_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_t1cmr.fd_ = "texlive"
PREFERRED_RPROVIDER_virtual/tex_textcomp.sty_ = "texlive"


## break dependency loops

RDEPENDS:glibc-common:remove = "glibc bash"
RDEPENDS:glibc-langpack-en:remove = "glibc"
RDEPENDS:glibc-gconv-extra:remove = "glibc"
RDEPENDS:glibc-all-langpacks:remove = "glibc"
RDEPENDS:libxcrypt-devel:remove = "glibc-devel"
RDEPENDS:redhat-rpm-config:remove = "pyproject-srpm-macros"
RDEPENDS:redhat-rpm-config:remove = "python-srpm-macros"
RDEPENDS:redhat-rpm-config:remove = "go-srpm-macros"
RDEPENDS:redhat-rpm-config:remove = "fonts-srpm-macros"
RDEPENDS:redhat-rpm-config:remove = "forge-srpm-macros"
RDEPENDS:rpm-libs:remove = "rpm"
RDEPENDS:binutils-gold:remove = "binutils"
RDEPENDS:almalinux-repos:remove = "almalinux-release"
RDEPENDS:ca-certificates:remove = "virtual/coreutils"

RDEPENDS:systemd-pam:remove = "systemd"

RDEPENDS:git:remove = "perl-Git"
RDEPENDS:perl-B:remove = "perl-Data-Dumper"
RDEPENDS:perl-libs:remove = "perl-DynaLoader"
RDEPENDS:perl-POSIX:remove = "perl-locale"
RDEPENDS:perl-libs:remove = "perl-Encode"
RDEPENDS:perl-libs:remove = "perl-PathTools"
RDEPENDS:perl-libs:remove = "perl-Carp"
RDEPENDS:perl-libs:remove = "perl-Exporter"
RDEPENDS:perl-IO-Socket-SSL:remove = "perl-HTTP-Tiny"
RDEPENDS:perl-Exporter:remove = "perl-Carp"
RDEPENDS:perl-Getopt-Long:remove = "perl-Pod-Usage"
RDEPENDS:perl-libs:remove = "perl-Getopt-Std"
